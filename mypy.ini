[mypy]
python_version = 3.13
# On garde la CI verte : on tolère les imports manquants (numpy/faiss, etc.).
ignore_missing_imports = True
# On évite les dossiers hors code.
exclude = (\.venv|\.hindex|build|dist)
# Quelques garde-fous utiles.
warn_unused_ignores = True

# Les tests peuvent être moins typés
[mypy-tests.*]
ignore_errors = True
